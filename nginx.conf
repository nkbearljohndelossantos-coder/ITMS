# Nginx Reverse Proxy Configuration for api.nkbmanufacturing.com
upstream api_backend {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.nkbmanufacturing.com itms.nkbmanufacturing.com nkbmanufacturing.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.nkbmanufacturing.com itms.nkbmanufacturing.com nkbmanufacturing.com;

    # SSL Certificate Paths
    ssl_certificate /etc/letsencrypt/live/api.nkbmanufacturing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nkbmanufacturing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max Request Body Size for File Uploads
    client_max_body_size 50M;

    # OpenAPI Interactive Documentation Proxy
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Centralized Public API Routes
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        
        # Header pass-through for WebSockets / Keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static Web Dashboard Admin Fallback
    location / {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
