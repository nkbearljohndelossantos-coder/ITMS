version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nkb_api_postgres
    restart: always
    environment:
      POSTGRES_DB: nkb_api_platform
      POSTGRES_USER: nkb_api_user
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nkb_api_user -d nkb_api_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nkb_api_server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://nkb_api_user:SecurePassword123!@postgres:5432/nkb_api_platform
      API_KEY_PEPPER: nkb_secret_pepper_prod_key_2026
      JWT_SECRET: nkb_jwt_secret_prod_key_2026
      CORS_ORIGIN: https://nkbmanufacturing.com,https://dcc.nkbmanufacturing.com,https://ppe.nkbmanufacturing.com

volumes:
  postgres_data:
